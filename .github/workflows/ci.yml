name: CI and Deploy

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  test:
    name: Test and validate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.1

      - name: Check out assets
        # Keep the test content outside the Docker build context.
        run: git clone --depth 1 --branch main -- https://github.com/sovue/es-doc-assets.git "${RUNNER_TEMP}/es-doc-assets"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.1
        with:
          python-version-file: pyproject.toml

      - name: Install PDM
        run: python -m pip install --upgrade pip pdm

      - name: Install dependencies
        run: pdm install --dev

      - name: Run tests
        env:
          ES_DOC_ASSETS_PATH: ${{ runner.temp }}/es-doc-assets
          ES_DOC_CACHE_PATH: ${{ runner.temp }}/es-doc-cache
        run: |
          mkdir -p "${ES_DOC_CACHE_PATH}"
          pdm run python -m unittest discover -s tests -v

      - name: Compile application
        run: pdm run python -m compileall -q app

      - name: Validate application Compose file
        run: docker compose --file docker-compose.yml config --quiet

      - name: Build application image
        run: docker build --tag es-doc:ci .

  deploy:
    name: Deploy to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: es-doc-production
      cancel-in-progress: false
    steps:
      - name: Update server and rebuild containers
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail

          : "${DEPLOY_HOST:?DEPLOY_HOST is required}"
          : "${DEPLOY_USER:?DEPLOY_USER is required}"
          : "${DEPLOY_PATH:?DEPLOY_PATH is required}"
          : "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY is required}"
          : "${DEPLOY_KNOWN_HOSTS:?DEPLOY_KNOWN_HOSTS is required}"

          key_file="${RUNNER_TEMP}/es-doc-deploy-key"
          known_hosts_file="${RUNNER_TEMP}/es-doc-known-hosts"
          install -m 600 /dev/null "${key_file}"
          install -m 600 /dev/null "${known_hosts_file}"
          printf '%s\n' "${DEPLOY_SSH_KEY}" >"${key_file}"
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" >"${known_hosts_file}"

          # The remote login shell may be fish; pass the script directly to Bash.
          ssh -i "${key_file}" \
            -o UserKnownHostsFile="${known_hosts_file}" \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=12 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -se' <<DEPLOY
          set -Eeuo pipefail
          cd -- $(printf '%q' "${DEPLOY_PATH}")
          # Serialize application and assets deployments across both repositories.
          exec 9>.deploy.lock
          flock -x 9
          git fetch origin main
          git reset --hard origin/main
          docker compose --env-file .env.production -f docker-compose.yml build web

          docker compose --env-file .env.production -f docker-compose.yml run --rm --no-deps --user root --entrypoint bash -e ASSETS_REF=main web -se <<'ASSETS'
          set -Eeuo pipefail
          git -c safe.directory=/app/content -C /app/content init -q -b "\${ASSETS_BRANCH}"
          if git -c safe.directory=/app/content -C /app/content remote get-url origin >/dev/null 2>&1; then
            test "\$(git -c safe.directory=/app/content -C /app/content remote get-url origin)" = "\${ASSETS_REPO}"
          else
            git -c safe.directory=/app/content -C /app/content remote add origin "\${ASSETS_REPO}"
          fi
          git -c safe.directory=/app/content -C /app/content fetch --depth=1 origin "\${ASSETS_REF}"
          git -c safe.directory=/app/content -C /app/content reset --hard FETCH_HEAD
          git -c safe.directory=/app/content -C /app/content checkout -B "\${ASSETS_BRANCH}"
          git -c safe.directory=/app/content -C /app/content update-ref "refs/remotes/origin/\${ASSETS_BRANCH}" HEAD
          git -c safe.directory=/app/content -C /app/content branch --set-upstream-to="origin/\${ASSETS_BRANCH}"
          chown -R app:app /app/content
          # Bind mounts retain host permissions; app must read static files and templates.
          chmod -R a+rX /app/static /app/templates
          ASSETS

          docker compose --env-file .env.production -f docker-compose.yml up -d --no-build --force-recreate --wait --wait-timeout 180 || {
            docker compose --env-file .env.production -f docker-compose.yml logs --tail=100
            exit 1
          }
          DEPLOY
