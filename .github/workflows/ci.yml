name: CI and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test and validate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.1

      - name: Check out assets
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.1
        with:
          repository: sovue/es-doc-assets
          path: assets

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.1
        with:
          python-version-file: pyproject.toml

      - name: Install PDM
        run: python -m pip install --upgrade pip pdm

      - name: Install dependencies
        run: pdm install --dev

      - name: Run tests
        env:
          ES_DOC_ASSETS_PATH: ${{ github.workspace }}/assets
        run: pdm run python -m unittest discover -s tests -v

      - name: Compile application
        run: pdm run python -m compileall -q app

      - name: Validate production Compose file
        run: docker compose --env-file .env.production.example --file compose.production.yaml config --quiet

  deploy:
    name: Deploy to production
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: es-doc-production
      cancel-in-progress: false
    steps:
      - name: Update server and rebuild containers
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail

          : "${DEPLOY_HOST:?DEPLOY_HOST is required}"
          : "${DEPLOY_USER:?DEPLOY_USER is required}"
          : "${DEPLOY_PATH:?DEPLOY_PATH is required}"
          : "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY is required}"
          : "${DEPLOY_KNOWN_HOSTS:?DEPLOY_KNOWN_HOSTS is required}"

          key_file="${RUNNER_TEMP}/es-doc-deploy-key"
          known_hosts_file="${RUNNER_TEMP}/es-doc-known-hosts"
          install -m 600 /dev/null "${key_file}"
          install -m 600 /dev/null "${known_hosts_file}"
          printf '%s\n' "${DEPLOY_SSH_KEY}" >"${key_file}"
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" >"${known_hosts_file}"

          # The remote login shell may be fish; pass the script directly to Bash.
          ssh -i "${key_file}" \
            -o UserKnownHostsFile="${known_hosts_file}" \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=12 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -se' <<DEPLOY
          set -Eeuo pipefail
          cd -- $(printf '%q' "${DEPLOY_PATH}")
          git fetch origin main
          git reset --hard origin/main
          docker compose --env-file .env.production -f compose.production.yaml up -d --build --wait --wait-timeout 180 || {
            docker compose --env-file .env.production -f compose.production.yaml logs --tail=100
            exit 1
          }
          DEPLOY
