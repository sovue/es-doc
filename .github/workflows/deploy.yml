name: Deploy

on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: Git ref for the ES Doc application
        required: true
        default: main
        type: string
      assets_ref:
        description: Git ref for es-doc-assets; a commit SHA is recommended
        required: true
        default: main
        type: string

concurrency:
  group: es-doc-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sovue/es-doc
  ASSETS_REPO: https://github.com/sovue/es-doc-assets.git

jobs:
  build:
    name: Build and publish image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      app_sha: ${{ steps.revisions.outputs.app_sha }}
      assets_sha: ${{ steps.revisions.outputs.assets_sha }}
      image_tag: sha-${{ steps.revisions.outputs.app_sha }}
    steps:
      - name: Check out application ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.1
        with:
          ref: ${{ inputs.app_ref }}
          fetch-depth: 1

      - name: Resolve immutable revisions
        id: revisions
        env:
          ASSETS_REPO: ${{ env.ASSETS_REPO }}
          ASSETS_REF: ${{ inputs.assets_ref }}
        shell: bash
        run: |
          set -Eeuo pipefail

          app_sha="$(git rev-parse HEAD)"
          if [[ ! "${app_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The application revision is not a full commit SHA" >&2
            exit 1
          fi

          if [[ "${ASSETS_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            assets_sha="${ASSETS_REF}"
          else
            refs="$(git ls-remote "${ASSETS_REPO}" \
              "refs/heads/${ASSETS_REF}" \
              "refs/tags/${ASSETS_REF}" || true)"
            assets_sha="$(printf '%s\n' "${refs}" | awk 'NF { print $1; exit }')"
          fi

          if [[ ! "${assets_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve assets ref: ${ASSETS_REF}" >&2
            exit 1
          fi

          {
            echo "app_sha=${app_sha}"
            echo "assets_sha=${assets_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.8.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ steps.revisions.outputs.app_sha }}
          flavor: |
            latest=false

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.0.0
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            APP_REVISION=${{ steps.revisions.outputs.app_sha }}
            ASSETS_REF=${{ steps.revisions.outputs.assets_sha }}
            ASSETS_REVISION=${{ steps.revisions.outputs.assets_sha }}
          cache-from: type=gha,scope=es-doc
          cache-to: type=gha,mode=max,scope=es-doc
          provenance: true
          sbom: true

  deploy:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out deployment files
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.1
        with:
          ref: ${{ inputs.app_ref }}
          sparse-checkout: |
            compose.production.yaml
            deploy/deploy.sh
            nginx.conf
          sparse-checkout-cone-mode: false

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          RELEASE_TAG: ${{ needs.build.outputs.image_tag }}
        shell: bash
        run: |
          set -Eeuo pipefail

          : "${DEPLOY_HOST:?DEPLOY_HOST is required}"
          : "${DEPLOY_USER:?DEPLOY_USER is required}"
          : "${DEPLOY_PATH:?DEPLOY_PATH is required}"
          : "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY is required}"
          : "${DEPLOY_KNOWN_HOSTS:?DEPLOY_KNOWN_HOSTS is required}"

          key_file="${RUNNER_TEMP}/es-doc-deploy-key"
          known_hosts_file="${RUNNER_TEMP}/es-doc-known-hosts"
          install -m 600 /dev/null "${key_file}"
          install -m 600 /dev/null "${known_hosts_file}"
          printf '%s\n' "${DEPLOY_SSH_KEY}" >"${key_file}"
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" >"${known_hosts_file}"

          ssh_options=(
            -i "${key_file}"
            -o UserKnownHostsFile="${known_hosts_file}"
            -o StrictHostKeyChecking=yes
          )
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"

          ssh "${ssh_options[@]}" "${remote}" "mkdir -p -- '${DEPLOY_PATH}/deploy'"
          scp "${ssh_options[@]}" compose.production.yaml nginx.conf "${remote}:${DEPLOY_PATH}/"
          scp "${ssh_options[@]}" deploy/deploy.sh "${remote}:${DEPLOY_PATH}/deploy/deploy.sh"
          ssh "${ssh_options[@]}" "${remote}" "chmod 700 '${DEPLOY_PATH}/deploy/deploy.sh'"

          if [[ -n "${GHCR_USERNAME:-}" || -n "${GHCR_TOKEN:-}" ]]; then
            : "${GHCR_USERNAME:?GHCR_USERNAME is required when GHCR_TOKEN is set}"
            : "${GHCR_TOKEN:?GHCR_TOKEN is required when GHCR_USERNAME is set}"
            printf '%s' "${GHCR_TOKEN}" | ssh "${ssh_options[@]}" "${remote}" \
              "docker login ghcr.io --username '${GHCR_USERNAME}' --password-stdin"
          fi

          ssh "${ssh_options[@]}" "${remote}" \
            "cd '${DEPLOY_PATH}' && ./deploy/deploy.sh '${RELEASE_TAG}'"
